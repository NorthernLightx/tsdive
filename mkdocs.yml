site_name: tsdive
site_description: Data-quality profiling and statistical monitoring for process time series from any source.
site_url: https://northernlightx.github.io/tsdive/
repo_url: https://github.com/NorthernLightx/tsdive
repo_name: NorthernLightx/tsdive
edit_uri: edit/main/docs/
copyright: Apache-2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  font: false
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - scripts/mkdocs_hooks.py

watch:
  - README.md
  - CHANGELOG.md
  - BENCHMARKS.md
  - src/tsdive
  - scripts/mkdocs_hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 3
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            members_order: source
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - Concepts:
          - Windows and time zones: guide/concepts/windows-and-time.md
          - Archives and metadata: guide/concepts/archives-and-metadata.md
          - The sampling contract: guide/concepts/sampling-contract.md
          - Quality codes and severity: guide/concepts/quality-and-severity.md
          - Coverage and gap classes: guide/concepts/coverage-and-gaps.md
          - Clipping and censoring: guide/concepts/clipping-and-censoring.md
          - Baselines and the MAD screen: guide/concepts/baselines.md
          - SPC rules: guide/concepts/spc-rules.md
          - "MSPC: T2, SPE and contributors": guide/concepts/mspc.md
          - Compare's three tables: guide/concepts/compare.md
          - Refusals: guide/concepts/refusals.md
      - Reading the output:
          - profile: guide/output/profile.md
          - screen: guide/output/screen.md
          - spc: guide/output/spc.md
          - mspc: guide/output/mspc.md
          - compare: guide/output/compare.md
          - switchback analyze: guide/output/switchback.md
      - How-to guides:
          - Ingest a PI, IP.21 or OPC export: guide/howto/historian-export.md
          - Choose a clean baseline window: guide/howto/baseline-window.md
          - Check many tags at once: guide/howto/many-tags.md
          - Use tsdive from Python and pandas: guide/howto/python.md
          - Connect an AI assistant: guide/howto/mcp.md
          - Test a controller tuning: guide/howto/switchback-trial.md
      - Command tour: usage.md
      - Switchback trials: SWITCHBACK.md
  - Reference:
      - CLI: reference/cli.md
      - API reference:
          - reference/api/index.md
          - Reading and ingest: reference/api/reading-and-ingest.md
          - Analyses: reference/api/analyses.md
          - Switchback: reference/api/switchback.md
          - Evaluation: reference/api/eval.md
          - Archive, sampling contract and types: reference/api/types.md
          - Errors: reference/api/errors.md
      - Errors and refusals: reference/errors.md
      - Glossary: reference/glossary.md
      - Archive schema: SCHEMA.md
      - Source adapters: SOURCES.md
      - MCP server: MCP.md
  - Project:
      - Scope: SCOPE.md
      - Roadmap: ROADMAP.md
      - Datasets and studies: DATA.md
      - Evaluation protocol: EVAL.md
      - Benchmarks: benchmarks.md
      - Changelog: changelog.md
